# electron-builder 打包配置
appId: com.zhuplay.desktop
productName: ZhuPlay

directories:
  output: release
  buildResources: build

# 只打包运行必需的文件：构建产物 + 主进程 + 清单
files:
  - dist/**/*
  - electron/**/*
  - package.json

# 托盘 / 窗口图标放在 asar 外，主进程按 process.resourcesPath 读取
extraResources:
  - from: build/icon.ico
    to: icon.ico

asar: true
compression: normal

# 自动更新：GitHub Releases（发布时用 electron-builder --publish always）
publish:
  provider: github
  owner: Rockrawrr
  repo: ZhuPlay

# 项目没有原生依赖，跳过 rebuild 更快
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZhuPlay
  deleteAppDataOnUninstall: false
